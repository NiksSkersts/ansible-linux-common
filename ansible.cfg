[defaults]
roles_path = ./roles
host_key_checking = True
pipelining = false
timeout = 15
gathering = smart
fact_caching = jsonfile
fact_caching_connection = ~/.ansible/facts
fact_caching_timeout = 86400
retry_files_enabled = True
retry_files_save_path = ~/.ansible/retry
#task_timeout = 60

[connection]
pipelining = false

[ssh_connection]
ansible_control_path="%(directory)s/ansible-ssh-%%h-%%p-%%r-{{ inventory_hostname }}"
control_persist = yes
pipelining = false
scp_if_ssh = True
